<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lizzy Romance Game – Mexico Route</title>
<style>
    body {
        margin: 0;
        background: #0d0d0d;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* Контейнер карты */
    #map-wrapper {
        position: relative;
        width: 90vw; /* адаптивная ширина */
        height: calc(90vw * 832 / 1248); /* сохраняем пропорции карты */
        max-height: 90vh;
        border-radius: 20px;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
        overflow: hidden;
        animation: fadeIn 1.2s ease;
    }

    #map {
        position: absolute;
        inset: 0;
        background-image: url('BingAIGC.jpg');
        background-size: 100% 100%;
        background-repeat: no-repeat;
    }

    #lines-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.97); }
        to { opacity: 1; transform: scale(1); }
    }
