<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lizzy Romance Game – Mexico Route</title>
    <style>
        body {
            margin: 0;
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        /* Карта фиксированного размера 1248x832 */
        #map-wrapper {
            position: relative;
            width: 1248px;
            height: 832px;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0,0,0,0.6);
            overflow: hidden;
            animation: fadeIn 1.2s ease;
        }

        #map {
            position: absolute;
            inset: 0;
            background-image: url('BingAIGC.jpg'); /* твоя карта Мексики 1248x832 */
            background-size: 100% 100%;
            background-repeat: no-repeat;
        }

        /* Слой для линий маршрута */
        #lines-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Точки маршрута */
        .checkpoint {
            position: absolute;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            animation: popIn 0.4s ease;
        }

        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .checkpoint:hover {
            transform: scale(1.15);
            box-shadow: 0 0 15px rgba(255,255,255,0.6);
        }

        .cp-icon {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }

        /* Линии маршрута */
        .route-line {
            stroke: rgba(255,255,255,0.85);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Оверлей и окно локации */
        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: none;
        }

        #location-window {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 420px;
            background: rgba(20,20,20,0.95);
            color: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(0,0,0,0.7);
            display: none;
            animation: windowFade 0.3s ease;
        }

        @keyframes windowFade {
            from { opacity: 0; transform: translate(-50%, -48%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }

        .location-title {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .location-desc {
            font-size: 15px;
            opacity: 0.85;
            margin-bottom: 20px;
        }

        .close-btn {
            background: #ff4d4d;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            color: white;
            transition: 0.2s;
        }

        .close-btn:hover {
            background: #ff2a2a;
        }
    </style>
</head>
<body>
