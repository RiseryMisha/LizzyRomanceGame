<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mexico Route Map</title>

<style>
    body {
        margin: 0;
        background: #0d0d0d;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: Arial, sans-serif;
    }

    /* Адаптивная карта */
    #map-wrapper {
        position: relative;
        width: 90vw;
        height: calc(90vw * 832 / 1248);
        max-width: calc(90vh * 1248 / 832);
        max-height: 90vh;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    #map {
        position: absolute;
        inset: 0;
        background-image: url('BingAIGC.jpg');
        background-size: 100% 100%;
        background-repeat: no-repeat;
    }

    #lines-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
    }

    /* Точки */
    .checkpoint {
        position: absolute;
        transform: translate(-50%, -50%);
        cursor: pointer;
        width: calc(48px * var(--scale));
        height: calc(48px * var(--scale));
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        color: white;
        background: rgba(255,255,255,0.15);
        border: 2px solid transparent;
        transition: 0.2s;
    }

    .checkpoint:hover {
        transform: translate(-50%, -50%) scale(1.15);
        box-shadow: 0 0 20px rgba(255,255,255,0.7);
    }

    .checkpoint.active {
        border-color: gold;
        box-shadow: 0 0 25px gold;
        background: rgba(255,215,0,0.3);
    }

    .checkpoint.passed {
        border-color: #00e6c6;
        background: rgba(0,230,198,0.3);
    }

    .checkpoint.unpassed {
        border-color: #ff4d4d;
        background: rgba(255,77,77,0.3);
    }

    .cp-icon {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    /* Линии маршрута */
    .route-line {
        stroke-width: calc(3px * var(--scale));
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: drawLine 2s ease forwards;
    }

    @keyframes drawLine {
        to { stroke-dashoffset: 0; }
    }
</style>
</head>
<body>

<div id="map-wrapper">
    <div id="map"></div>
    <svg id="lines-layer"></svg>
</div>

<script>
/* Прогресс маршрута */
let progress = 0; // 0–24

/* Координаты точек на карте 1248x832 */
const checkpoints = [
    { id: 1,  name: "Mexico City (Zócalo)",          x: 650, y: 520 },
    { id: 2,  name: "Iztaccihuatl Volcano",          x: 670, y: 500 },
    { id: 3,  name: "Pico de Orizaba",               x: 750, y: 500 },
    { id: 4,  name: "El Mirador del Cuervo (Hidalgo)", x: 650, y: 480 },
    { id: 5,  name: "Teotihuacan Pyramids",          x: 680, y: 480 },
    { id: 6,  name: "San Miguel de Allende",         x: 600, y: 470 },
    { id: 7,  name: "Guanajuato",                    x: 590, y: 460 },
    { id: 8,  name: "Zacatecas",                     x: 540, y: 430 },
    { id: 9,  name: "Guadalajara",                   x: 520, y: 500 },
    { id: 10, name: "Tequila",                       x: 510, y: 490 },
    { id: 11, name: "La Quemada Ruins",              x: 540, y: 440 },
    { id: 12, name: "Durango",                       x: 500, y: 400 },
    { id: 13, name: "Torreon",                       x: 530, y: 390 },
    { id: 14, name: "Coahuila Plains",               x: 560, y: 370 },
    { id: 15, name: "Casas Grandes (Paquimé)",       x: 480, y: 360 },
    { id: 16, name: "Ciudad Juarez",                 x: 470, y: 340 },
    { id: 17, name: "Sonora Desert",                 x: 430, y: 350 },
    { id: 18, name: "Hermosillo",                    x: 410, y: 380 },
    { id: 19, name: "Guaymas & San Carlos",          x: 400, y: 410 },
    { id: 20, name: "Puerto Peñasco",                x: 430, y: 330 },
    { id: 21, name: "San Felipe",                    x: 390, y: 320 },
    { id: 22, name: "Guadalupe Valley",              x: 360, y: 310 },
    { id: 23, name: "Guerrero Negro",                x: 330, y: 360 },
    { id: 24, name: "Rosarito",                      x: 350, y: 300 }
];

function renderMap() {
    const wrapper = document.getElementById("map-wrapper");
    const svg = document.getElementById("lines-layer");

    const scale = wrapper.clientWidth / 1248;
    document.documentElement.style.setProperty("--scale", scale);

    svg.setAttribute("width", wrapper.clientWidth);
    svg.setAttribute("height", wrapper.clientHeight);

    checkpoints.forEach((cp, index) => {
        const el = document.createElement("div");
        el.classList.add("checkpoint");

        const px = cp.x * scale;
        const py = cp.y * scale;

        el.style.left = px + "px";
        el.style.top  = py + "px";

        const iconPath = `Icons/${cp.id}.png`;

        fetch(iconPath)
            .then(res => {
                if (res.ok) {
                    el.innerHTML = `<img src="${iconPath}" class="cp-icon">`;
                } else {
                    el.textContent = cp.id;
                }
            })
            .catch(() => {
                el.textContent = cp.id;
            });

        if (index < progress) el.classList.add("passed");
        else el.classList.add("unpassed");

        if (index === progress) el.classList.add("active");

        document.getElementById("map-wrapper").appendChild(el);
    });

    for (let i = 0; i < checkpoints.length - 1; i++) {
        const a = checkpoints[i];
        const b = checkpoints[i + 1];

        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", a.x * scale);
        line.setAttribute("y1", a.y * scale);
        line.setAttribute("x2", b.x * scale);
        line.setAttribute("y2", b.y * scale);

        line.style.stroke = i < progress - 1 ? "#00e6c6" : "#ff4d4d";
        line.setAttribute("class", "route-line");

        svg.appendChild(line);
    }
}

renderMap();
</script>

</body>
</html>
