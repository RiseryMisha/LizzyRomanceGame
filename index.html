<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romantic Adventure - Mexico Route</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #2b1810;
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-layout {
            display: flex;
            width: 95vw;
            height: 90vh;
            max-width: 1600px;
            background: #1a0f0a;
            border: 6px solid #d4af37;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        .map-section {
            position: relative;
            width: 75%;
            height: 100%;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .map-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .route-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .route-line-pending {
            fill: none;
            stroke: #ff3333;
            stroke-width: 3;
            stroke-dasharray: 6, 6;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 4px #ff0000);
        }

        .route-line-completed {
            fill: none;
            stroke: #00bfff;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 6px #00bfff);
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawRoute 2s ease forwards;
        }

        @keyframes drawRoute {
            to {
                stroke-dashoffset: 0;
            }
        }

        .info-section {
            width: 25%;
            height: 100%;
            background-image: linear-gradient(to bottom, #fdf6e2, #e6d2a5);
            border-left: 4px solid #b8860b;
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: #2b1810;
            box-shadow: inset 10px 0 20px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        .info-card {
            position: relative;
            width: 100%;
            height: 100%;
            background: #fdf4dd;
            border-radius: 10px;
            border: 2px solid #d4af37;
            padding: 18px 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .info-card::before,
        .info-card::after {
            content: "";
            position: absolute;
            width: 22px;
            height: 22px;
            border: 2px solid #d4af37;
        }

        .info-card::before {
            top: -4px;
            left: -4px;
            border-right: none;
            border-bottom: none;
            border-radius: 10px 0 0 0;
        }

        .info-card::after {
            bottom: -4px;
            right: -4px;
            border-left: none;
            border-top: none;
            border-radius: 0 0 10px 0;
        }

        .info-header {
            margin-bottom: 10px;
        }

        .info-header h2 {
            font-size: 18px;
            color: #8b0000;
            margin-bottom: 8px;
            border-bottom: 1px solid #d4af37;
            padding-bottom: 6px;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .progress-strip {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-bottom: 10px;
        }

        .progress-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #c9a76a;
            opacity: 0.4;
        }

        .progress-dot.completed {
            background: #00bfff;
            opacity: 0.9;
        }

        .progress-dot.active {
            background: #d4af37;
            box-shadow: 0 0 6px rgba(212,175,55,0.9);
            opacity: 1;
        }

        .info-img-large {
            width: 100%;
            max-height: 190px;
            object-fit: contain;
            display: block;
            margin: 0 auto 12px auto;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.35));
        }

        .info-body {
            font-size: 14px;
            line-height: 1.6;
            color: #3b2219;
            overflow-y: auto;
            max-height: calc(90vh - 360px);
            padding-right: 4px;
        }

        .info-body p {
            margin-bottom: 10px;
        }

        .quest-box {
            margin-top: 10px;
            border-left: 3px solid #8b0000;
            padding: 8px 10px;
            background: rgba(139, 0, 0, 0.06);
            font-style: italic;
            border-radius: 6px;
        }

        .quest-box strong {
            color: #8b0000;
        }

        .action-btn {
            display: block;
            width: 100%;
            background: #8b0000;
            color: #fff;
            border: none;
            padding: 11px;
            font-size: 14px;
            font-family: 'Georgia', serif;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
        }

        .action-btn:hover {
            background: #a00000;
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.35);
        }

        .action-btn.completed-status {
            background: #2e7d32;
            cursor: default;
            transform: none;
        }

        .action-btn.locked-status {
            background: #795548;
            cursor: not-allowed;
            transform: none;
        }

        .info-footer {
            text-align: center;
            font-size: 11px;
            color: #705335;
            font-style: italic;
            border-top: 1px solid #d4af37;
            padding-top: 6px;
            margin-top: 8px;
        }

        .checkpoint {
            position: absolute;
            width: 81px;
            height: 81px;
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: transform 0.3s ease, filter 0.3s ease, opacity 0.3s ease;
            z-index: 10;
            background: transparent;
            border: none;
        }

        .checkpoint img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
        }

        .checkpoint span {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 2px 6px;
            border-radius: 4px;
            display: none;
        }

        .checkpoint img:not([src]), .checkpoint img[src=""] {
            display: none;
        }

        .checkpoint.locked-step {
            cursor: not-allowed;
        }

        .checkpoint.locked-step img {
            filter: grayscale(100%) brightness(0.5);
            opacity: 0.7;
        }

        .checkpoint.completed-step img {
            filter: drop-shadow(0 0 10px #00bfff);
            opacity: 0.95;
        }

        .checkpoint.active-step img {
            filter: drop-shadow(0 0 12px rgba(212,175,55,1));
        }

        .checkpoint:not(.locked-step):hover {
            transform: translate(-50%, -50%) scale(1.35);
            z-index: 20;
        }

    </style>
</head>

        let currentStep = Number(localStorage.getItem('mexicoRouteProgress')) || 1;

        function buildProgressStrip() {
            const strip = document.getElementById('progress-strip');
            strip.innerHTML = "";
            for (let i = 1; i <= 24; i++) {
                const dot = document.createElement('div');
                dot.classList.add('progress-dot');
                if (i < currentStep) dot.classList.add('completed');
                else if (i === currentStep) dot.classList.add('active');
                strip.appendChild(dot);
            }
        }

        function clickLocation(step) {
            showLocationInfo(step);
            highlightCheckpoints();
            buildProgressStrip();
        }

        function showLocationInfo(step) {
            const data = locationsData[step];
            if (!data) return;

            document.getElementById('info-title').innerText = data.title;

            const infoImg = document.getElementById('info-img');
            infoImg.style.display = 'block';
            infoImg.src = `Icons/${step}.png`;

            let contentHTML = `<p>${data.history}</p>`;
            let actionHTML = "";

            if (step === currentStep && currentStep <= 24) {
                actionHTML = `<button class="action-btn" onclick="startQuest(${step})">Начать задание ➔</button>`;
            } else if (step < currentStep) {
                actionHTML = `<button class="action-btn completed-status">✅ Этап пройден</button>`;
            } else {
                actionHTML = `<button class="action-btn locked-status">🔒 Этап заблокирован</button>`;
            }

            document.getElementById('info-content').innerHTML = contentHTML;
            document.getElementById('info-action').innerHTML = actionHTML;
        }

        function startQuest(step) {
            const data = locationsData[step];
            if (!data) return;

            let contentHTML = `<p>${data.history}</p>`;
            contentHTML += `<div class="quest-box"><strong>🎯 Задание:</strong><br>${data.quest}</div>`;
            
            let actionHTML = `<button class="action-btn" onclick="completeCurrentStep()">Выполнить задание и продвинуться ➔</button>`;

            document.getElementById('info-content').innerHTML = contentHTML;
            document.getElementById('info-action').innerHTML = actionHTML;
        }

        function completeCurrentStep() {
            if (currentStep < 24) {
                currentStep++;
                localStorage.setItem('mexicoRouteProgress', currentStep);
            } else {
                alert("🎉 Поздравляем! Вы прошли весь маршрут до Росарито!");
            }
            updateMapDisplay();
            showLocationInfo(currentStep);
            highlightCheckpoints();
            buildProgressStrip();
        }

        function highlightCheckpoints() {
            const container = document.getElementById('mapContainer');
            for (let i = 1; i <= 24; i++) {
                const cp = container.querySelector(`.cp-${i}`);
                if (!cp) continue;
                cp.classList.remove('locked-step', 'completed-step', 'active-step');
                if (i < currentStep) {
                    cp.classList.add('completed-step');
                } else if (i === currentStep) {
                    cp.classList.add('active-step');
                } else {
                    cp.classList.add('locked-step');
                }
            }
        }

        function updateMapDisplay() {
            const container = document.getElementById('mapContainer');
            const rect = container.getBoundingClientRect();
            
            let allPoints = [];
            
            for (let i = 1; i <= 24; i++) {
                const cp = container.querySelector(`.cp-${i}`);
                if (cp) {
                    const cpRect = cp.getBoundingClientRect();
                    const x = (cpRect.left + cpRect.width / 2) - rect.left;
                    const y = (cpRect.top + cpRect.height / 2) - rect.top;
                    allPoints.push({ x, y });
                }
            }

            let pendingStr = allPoints.map(p => `${p.x},${p.y}`).join(' ');
            document.getElementById('routePending').setAttribute('points', pendingStr);

            let completedPoints = allPoints.slice(0, currentStep);
            let completedStr = completedPoints.map(p => `${p.x},${p.y}`).join(' ');
            document.getElementById('routeCompleted').setAttribute('points', completedStr);
        }

        window.addEventListener('load', () => {
            updateMapDisplay();
            highlightCheckpoints();
            showLocationInfo(currentStep);
            buildProgressStrip();
        });
        window.addEventListener('resize', () => {
            updateMapDisplay();
        });
        setTimeout(() => {
            updateMapDisplay();
        }, 100);
    </script>
</body>
</html>
