<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lizzy Romance Game</title>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
        }

        #map {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-image: url('BingAIGC.jpg');
            background-size: cover;
            background-position: center;
        }

        .checkpoint {
            position: absolute;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
        }

        .cp-icon {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        const checkpoints = [
            { id: 1, x: 100, y: 200 },
            { id: 2, x: 150, y: 250 },
            { id: 3, x: 200, y: 300 },
            { id: 4, x: 250, y: 350 },
            { id: 5, x: 300, y: 400 },
            { id: 6, x: 350, y: 450 },
            { id: 7, x: 400, y: 500 },
            { id: 8, x: 450, y: 550 },
            { id: 9, x: 500, y: 600 },
            { id: 10, x: 550, y: 650 },
            { id: 11, x: 600, y: 700 },
            { id: 12, x: 650, y: 750 },
            { id: 13, x: 700, y: 800 },
            { id: 14, x: 750, y: 850 },
            { id: 15, x: 800, y: 900 },
            { id: 16, x: 850, y: 950 },
            { id: 17, x: 900, y: 1000 },
            { id: 18, x: 950, y: 1050 },
            { id: 19, x: 1000, y: 1100 },
            { id: 20, x: 1050, y: 1150 },
            { id: 21, x: 1100, y: 1200 },
            { id: 22, x: 1150, y: 1250 },
            { id: 23, x: 1200, y: 1300 },
            { id: 24, x: 1250, y: 1350 }
        ];

        function renderCheckpoints() {
            const container = document.getElementById("map");

            checkpoints.forEach(cp => {
                const el = document.createElement("div");
                el.classList.add("checkpoint");
                el.style.left = cp.x + "px";
                el.style.top = cp.y + "px";

                const iconPath = `Icons/${cp.id}.png`;

                fetch(iconPath)
                    .then(res => {
                        if (res.ok) {
                            el.innerHTML = `<img src="${iconPath}" class="cp-icon" alt="icon-${cp.id}">`;
                        } else {
                            el.textContent = cp.id;
                        }
                    })
                    .catch(() => {
                        el.textContent = cp.id;
                    });

                container.appendChild(el);
            });
        }

        renderCheckpoints();
    </script>
</body>
</html>
